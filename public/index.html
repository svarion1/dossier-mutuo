<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 15 16 5l12 10v12H4z%22 fill=%22%2301696f%22/%3E%3C/svg%3E">
  <title>Dossier mutuo SAL · Casa Buretta</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@500,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-5h6v5"/><path d="M5 14h14" stroke-dasharray="2 2"/></svg>
      </span>
      <div>
        <div class="brand-title">Casa Buretta</div>
        <div class="brand-sub">Dossier mutuo SAL</div>
      </div>
    </div>
    <nav class="nav" aria-label="Sezioni">
      <button data-tab="overview" class="active">Panoramica</button>
      <button data-tab="banks">Banche</button>
      <button data-tab="compare">Confronto offerte</button>
      <button data-tab="docs">Documenti</button>
      <button data-tab="costs">Costi e pagamenti</button>
      <button data-tab="tasks">Passi operazione</button>
      <button data-tab="email">Email</button>
    </nav>
    <div class="sidebar-foot">
      <div id="saveState" class="save-state">Connessione…</div>
      <div class="io">
        <button class="btn btn-ghost btn-sm" id="exportBtn">Esporta dati</button>
        <label class="btn btn-ghost btn-sm" for="importFile">Importa</label>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div id="modeBanner" class="banner" hidden></div>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg" class="dlg">
  <form method="dialog" id="dlgForm"></form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
