version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: alex-dossier-mutuo_dossier_1
      APP_PORT: 8790

  dossier:
    image: svarion1/dossier-mutuo:1.0.0
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Rome
      MAX_UPLOAD_MB: 200
      DOSSIER_PASSWORD: ""
    volumes:
      - ${APP_DATA_DIR}/data:/data