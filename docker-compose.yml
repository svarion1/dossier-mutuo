services:
  dossier:
    build: .
    image: dossier-mutuo-buretta:latest
    container_name: dossier-mutuo
    restart: unless-stopped
    # uid/gid 1000 = utente "umbrel": i file restano tuoi e visibili nell'app File
    user: "1000:1000"
    ports:
      - "${DOSSIER_PORT:-8790}:8790"
    environment:
      - TZ=Europe/Rome
      - DOSSIER_PASSWORD=${DOSSIER_PASSWORD:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
    volumes:
      # Cartella dati sul disco. Su Umbrel: /home/umbrel/umbrel/home/Dossier-mutuo (visibile nell'app File)
      - ${DATA_PATH:-./data}:/data
